name: Post-Deploy Smoke Test

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Live Smoke Test
        run: ./live-smoke-test.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node for Browser Test
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        run: |
          # Resolve target URL from smoke test
          if [ -f effective_url.txt ]; then
            export EFFECTIVE_URL=$(cat effective_url.txt)
          else
            export EFFECTIVE_URL="https://uutisseuranta.net"
          fi
          npx playwright test
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@b4b15b8c7c25146c59d9c2409f9872e47879e602 # v4.4.3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify-ops:
    needs: [smoke-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.smoke-test.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
      - name: Send Status to Centralized CI Monitor (ops repo)
        env:
          OPS_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$OPS_TOKEN" ]; then
            echo "::warning::OPS_DISPATCH_TOKEN secret is missing! Skipping notification."
            exit 0
          fi
          curl -s -X POST \
            -H "Authorization: token $OPS_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/uutisseuranta/ops/dispatches \
            -d '{
              "event_type": "workflow-notification",
              "client_payload": {
                "repo": "${{ github.repository }}",
                "workflow": "${{ github.workflow }}",
                "status": "${{ steps.status.outputs.status }}",
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'
