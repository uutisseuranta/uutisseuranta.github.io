name: PR Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (Local Preview)
        run: |
          npx vite preview --port 4173 &
          # Wait for preview server to start
          for i in {1..10}; do
            curl -s http://localhost:4173 > /dev/null && break
            sleep 1
          done
          npx playwright test
        env:
          EFFECTIVE_URL: http://localhost:4173
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@b4b15b8c7c25146c59d9c2409f9872e47879e602 # v4.4.3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
