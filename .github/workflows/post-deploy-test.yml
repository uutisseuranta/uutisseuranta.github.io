name: Trigger Ops Smoke Test

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  trigger-smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Live Smoke Test (Resolve URL)
        run: ./live-smoke-test.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Ops Smoke Test via Repository Dispatch
        env:
          OPS_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$OPS_TOKEN" ]; then
            echo "::warning::OPS_DISPATCH_TOKEN secret is missing! Skipping dispatch."
            exit 0
          fi
          
          # Selvitetään kohde-URL (effective_url)
          TARGET_URL="https://uutisseuranta.net"
          if [ -f effective_url.txt ]; then
            TARGET_URL=$(cat effective_url.txt)
          fi
          
          echo "Triggering ops smoke-test for URL: $TARGET_URL"
          
          curl -s -X POST \
            -H "Authorization: token $OPS_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/uutisseuranta/ops/dispatches \
            -d "{
              \"event_type\": \"run-smoke-tests\",
              \"client_payload\": {
                \"repo\": \"${{ github.repository }}\",
                \"target_url\": \"$TARGET_URL\",
                \"run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }
            }"
